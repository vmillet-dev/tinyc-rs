# Where the IDE to build against lives.
#
# Building against an IDE already installed on this machine downloads nothing at
# all: the platform jars are the ones that IDE is running from, and `runIde`
# launches it with the plugin in a sandbox.
#
# Leave this blank unless the IDE is somewhere unusual — the build looks in the
# places installers and Toolbox use, and only downloads when it finds nothing.
# What it downloads is IntelliJ IDEA `platformVersion`; note that IDEA Community
# is not a separate download since 2025.3, so `platformVersion` must be one that
# the unified distribution is published for.
tinycIdePath=
platformVersion=2026.2

# The plugin runs inside an IDE that already ships the Kotlin runtime, so
# bundling a second copy of it is both waste and a source of clashes.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.configuration-cache=false
